name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example 0.3.0 or 0.3.0-alpha.1). Overrides the version MinVer derives from tags."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required by NuGet trusted publishing

jobs:
  publish:
    name: Build, test, pack and publish
    runs-on: windows-latest
    env:
      MinVerVersionOverride: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate version override
        if: env.MinVerVersionOverride != ''
        shell: pwsh
        run: |
          if ($env:MinVerVersionOverride -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$env:MinVerVersionOverride' is not a valid NuGet package version."
          }

      - name: Restore
        run: dotnet restore CESDK.slnx

      - name: Build (Release)
        run: dotnet build CESDK.slnx --no-restore -c Release

      # The full test run gates the publish: a broken package must never reach nuget.org.
      - name: Test
        run: dotnet test --solution CESDK.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/CESDK -c Release -o artifacts/nuget

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          retention-days: 90

      # The user is the nuget.org account that registered this repository and workflow as a trusted publisher.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ShadowNineX

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
