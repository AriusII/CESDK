name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CESDK.slnx

      # The tests run against Debug because some guards exist only there. Release is what ships.
      - name: Build (Debug)
        run: dotnet build CESDK.slnx --no-restore -c Debug

      - name: Build (Release)
        run: dotnet build CESDK.slnx --no-restore -c Release

      # Tests tagged Category=NativeLua need a Lua 5.3 DLL (see tests/CESDK.Tests.Shared/README.md) and report Skipped on this runner.
      - name: Test
        run: >-
          dotnet test --solution CESDK.slnx --no-build -c Debug
          --report-trx --results-directory artifacts/test-results
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Pack
        run: dotnet pack src/CESDK -c Release -o artifacts/nuget

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          retention-days: 14
